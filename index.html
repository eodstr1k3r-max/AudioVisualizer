  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04060d; }
    #root { width: 100%; height: 100%; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 42%, rgba(139,92,246,0.14), #04060d 72%);
      color: #93a3bd; font-family: system-ui, sans-serif; font-size: 0.92rem; letter-spacing: 0.06em; z-index: 9999; }
    #boot .spinner { position: relative; width: 54px; height: 54px; margin: 0 auto 18px; }
    #boot .spinner::before, #boot .spinner::after { content: ''; position: absolute; inset: 0;
      border-radius: 50%; border: 2px solid transparent; }
    #boot .spinner::before { border-top-color: #8b5cf6; border-right-color: rgba(139,92,246,0.35);
      animation: spin 0.9s linear infinite; box-shadow: 0 0 24px rgba(139,92,246,0.35); }
    #boot .spinner::after { inset: 8px; border-bottom-color: #22d3ee; animation: spin 1.3s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
